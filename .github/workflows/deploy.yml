name: deploy apps
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      deploy_sha:
        required: true
        type: string
      source_event_name:
        required: true
        type: string
      source_ref:
        required: true
        type: string
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'README*'
      - 'LICENSE'

jobs:
  deploy:
    name: 'deploy to production'
    if: github.event_name == 'workflow_call' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: wait for oxc validation
        if: github.event_name == 'push'
        id: checks
        uses: actions/github-script@main
        with:
          script: |
            const workflow = 'oxc.yml'
            const conclusions = {}
            const registrationDeadline = Date.now() + 60_000
            const deadline = Date.now() + 30 * 60_000

            while (!conclusions[workflow]) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo,
                workflow_id: workflow,
                branch: 'main',
                event: 'push',
                head_sha: context.sha,
                per_page: 100
              })
              const run = runs
                .filter((run) => run.head_sha === context.sha &&
                  run.head_branch === 'main' && run.event === 'push')
                .sort((a, b) => b.id - a.id)[0]

              if (!run && Date.now() >= registrationDeadline) {
                conclusions[workflow] = 'not_run'
                core.info(`${workflow}: not run for this commit`)
              } else if (run?.status === 'completed' && run.conclusion) {
                conclusions[workflow] = run.conclusion
                core.info(`${workflow}: ${run.conclusion}`)
              } else if (Date.now() >= deadline) {
                conclusions[workflow] = 'timed_out'
                core.warning(`${workflow}: timed out waiting for validation`)
              } else {
                core.info(`${workflow}: waiting (${run?.status ?? 'registration'})`)
                await new Promise((resolve) => setTimeout(resolve, 10_000))
              }
            }

            const conclusion = conclusions[workflow]
            const allowed = ['success', 'skipped', 'not_run'].includes(conclusion)

            core.setOutput('oxc_allowed', allowed)
            core.setOutput('oxc_conclusion', conclusion)

            if (!allowed) core.warning('oxc did not pass. Skipping deploy.')

            await core.summary
              .addTable([
                [{ data: 'Workflow', header: true }, { data: 'Conclusion', header: true }],
                [workflow, conclusion]
              ])
              .addRaw(`Deploy allowed: ${allowed}\n`)
              .write()

      - name: resolve deploy inputs
        id: resolve
        run: |
          SHOULD_DEPLOY="false"
          BASE_SHA=""
          DEPLOY_SHA=""

          if [ "$EVENT_NAME" = "workflow_call" ]; then
            if [ "$SOURCE_EVENT_NAME" = "push" ] && [ "$SOURCE_REF" = "refs/heads/main" ]; then
              SHOULD_DEPLOY="true"
              BASE_SHA="$INPUT_BASE_SHA"
              DEPLOY_SHA="$INPUT_DEPLOY_SHA"
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE_SHA="$EVENT_BEFORE"
            SOURCE_SHA="$PUSH_SHA"
            DEPLOY_SHA="$SOURCE_SHA"

            if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="$(git rev-list --max-parents=0 "$SOURCE_SHA")"
            fi

            if [ "$OXC_ALLOWED" != "true" ]; then
              echo "oxc conclusion was '$OXC_CONCLUSION'. Skipping deploy."
            elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              echo "Cannot resolve BASE_SHA ($BASE_SHA) locally. Refusing to guess; skipping deploy."
            else
              SHOULD_DEPLOY="true"
              git fetch origin refs/heads/main:refs/remotes/origin/main --force

              if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
                echo "Refusing deploy: $SOURCE_SHA is not contained in origin/main."
                SHOULD_DEPLOY="false"
              else
                # Include only the oxc autofix commit produced after this push.
                # Stop before any unrelated commit so another push cannot bypass validation.
                while IFS= read -r commit; do
                  [ "$(git show -s --format=%P "$commit")" = "$DEPLOY_SHA" ] || break
                  [ "$(git show -s --format=%ae "$commit")" = "41898282+github-actions[bot]@users.noreply.github.com" ] || break

                  case "$(git show -s --format=%s "$commit")" in
                    "style: run oxc autofix")
                      [ "$OXC_CONCLUSION" = "success" ] || break
                      ;;
                    *) break ;;
                  esac

                  DEPLOY_SHA="$commit"
                done < <(git rev-list --reverse --ancestry-path "$SOURCE_SHA..origin/main")
              fi
            fi
          fi

          {
            echo "should_deploy=$SHOULD_DEPLOY"
            echo "base_sha=$BASE_SHA"
            echo "deploy_sha=$DEPLOY_SHA"
          } >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          OXC_ALLOWED: ${{ steps.checks.outputs.oxc_allowed }}
          OXC_CONCLUSION: ${{ steps.checks.outputs.oxc_conclusion }}
          SOURCE_EVENT_NAME: ${{ inputs.source_event_name }}
          SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_DEPLOY_SHA: ${{ inputs.deploy_sha }}

      - name: checkout deploy sha
        if: steps.resolve.outputs.should_deploy == 'true'
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ steps.resolve.outputs.deploy_sha }}

      - name: verify deploy sha belongs to main
        if: steps.resolve.outputs.should_deploy == 'true'
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main --force

          if ! git merge-base --is-ancestor "${{ steps.resolve.outputs.deploy_sha }}" origin/main; then
            echo "Refusing deploy: ${{ steps.resolve.outputs.deploy_sha }} is not contained in origin/main."
            exit 1
          fi

      - name: setup ssh
        if: steps.resolve.outputs.should_deploy == 'true'
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          cat >>~/.ssh/config << END
          Host prod
            HostName $SSH_HOST
            User $SSH_USERNAME
            Port $SSH_PORT
            IdentityFile ~/.ssh/key
            StrictHostKeyChecking no
          END
        env:
          SSH_USERNAME: ${{ secrets.USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOST }}
          SSH_PORT: 22

      - name: deploy
        if: steps.resolve.outputs.should_deploy == 'true'
        env:
          DEPLOY_SHA: ${{ steps.resolve.outputs.deploy_sha }}
        run: |
          ssh prod "cd portfolio && DEPLOY_SHA=\"$DEPLOY_SHA\" bash -c '
            set -euo pipefail

            git fetch origin main
            git switch -C main \"\$DEPLOY_SHA\"
            git branch --set-upstream-to=origin/main main || true

            docker compose up -d --build
          '"
